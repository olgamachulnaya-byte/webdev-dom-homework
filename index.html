<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <p id="comments-loading" class="status-message">Комментарии загружаются...</p>

      <ul id="comments-list" class="comments hidden"></ul>

      <div id="add-form" class="add-form">
        <input
          type="text"
          id="name-input"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          id="text-input"
          class="add-form-text"
          placeholder="Введите ваш комментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button id="add-button" class="add-form-button">Написать</button>
        </div>
      </div>

      <p id="add-form-loading" class="status-message hidden">
        Комментарий добавляется
      </p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
