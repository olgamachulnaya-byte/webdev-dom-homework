<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    // Код писать здесь
 const nameInput = document.querySelector('.add-form-name');
const textInput = document.querySelector('.add-form-text');
const addButton = document.querySelector('.add-form-button');
const commentsList = document.querySelector('.comments');

// Данные
const comments = [
  {
    name: "Глеб Фокин",
    date: "12.02.22 12:18",
    text: "Это будет первый комментарий на этой странице",
    likes: 3,
    isLiked: false
  },
  {
    name: "Варвара Н.",
    date: "13.02.22 19:22",
    text: "Мне нравится как оформлена эта страница! ❤",
    likes: 75,
    isLiked: true
  }
];

// 1. Функция для защиты от XSS (обработка HTML-разметки)
const sanitize = (text) => {
  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
};

// 2. Функция рендеринга
const renderComments = () => {
  const commentsHtml = comments.map((comment, index) => {
    return `<li class="comment" data-index="${index}">
          <div class="comment-header">
            <div>${sanitize(comment.name)}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${sanitize(comment.text)}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likes}</span>
              <button class="like-button ${comment.isLiked ? '-active-like' : ''}" data-index="${index}"></button>
            </div>
          </div>
        </li>`;
  }).join('');

  commentsList.innerHTML = commentsHtml;

  initLikeButtonsListeners();
  initReplyListeners(); // Включаем возможность ответа
};

// 3. Механизм управления событиями для лайка
const initLikeButtonsListeners = () => {
  const likeButtons = document.querySelectorAll('.like-button');

  for (const likeButton of likeButtons) {
    likeButton.addEventListener('click', (event) => {
      // ОСТАНАВЛИВАЕМ всплытие (stopPropagation)
      // Теперь клик не "долетит" до родительского li.comment
      event.stopPropagation();

      const index = likeButton.dataset.index;
      const comment = comments[index];

      if (comment.isLiked) {
        comment.likes--;
      } else {
        comment.likes++;
      }
      comment.isLiked = !comment.isLiked;

      renderComments();
    });
  }
};

// 4. Логика цитирования при клике на комментарий
const initReplyListeners = () => {
  const commentElements = document.querySelectorAll('.comment');

  for (const commentElement of commentElements) {
    commentElement.addEventListener('click', () => {
      const index = commentElement.dataset.index;
      const comment = comments[index];

      // Формируем текст цитаты с символом >
      // Добавляем пустую строку после цитаты для удобства пользователя
      textInput.value = `> ${comment.text}\n\n${comment.name}, `;
      textInput.focus();
    });
  }
};

// Добавление комментария
addButton.addEventListener('click', () => {
  if (nameInput.value.trim() === "" || textInput.value.trim() === "") {
    return;
  }

  comments.push({
    name: nameInput.value,
    date: new Date().toLocaleString().slice(0, -3),
    text: textInput.value,
    likes: 0,
    isLiked: false
  });

  nameInput.value = "";
  textInput.value = "";
  renderComments();
});

// Первоначальный запуск
renderComments();
  </script>
</html>
